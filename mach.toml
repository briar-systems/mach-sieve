[project]
id      = "sieve"
version = "0.4.1"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch    = "x86_64"
sys     = "linux"
abi     = "sysv64"

[profile.debug]
default       = true
optimize      = false
debug         = true
simd          = "scalarize"

[profile.release]
optimize      = true
debug         = false
simd          = "scalarize"

[artifact.sieve]
kind    = "bin"
entry   = "bin/sieve.mach"
out     = "{project.work}/bin/sieve{artifact.suffix}"
targets = ["*"]
link    = []
need    = []

[dep.std]
git     = "https://github.com/briar-systems/mach-std"
ref     = "branch/dev"
